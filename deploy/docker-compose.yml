# Betrieb auf einem Server: ein Reverse-Proxy, dahinter die Produktiv-, die
# Test- und die Entwicklungsumgebung. Alle haben eigene Daten und sind über
# eigene Adressen erreichbar.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN:?PROD_DOMAIN fehlt}
      TEST_DOMAIN: ${TEST_DOMAIN:?TEST_DOMAIN fehlt}
      # Mit Vorgabewert, damit ältere .env-Dateien ohne DEV_DOMAIN weiter laufen.
      DEV_DOMAIN: ${DEV_DOMAIN:-develop.sitzordnung.celik-soft.de}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt}
    # Bewusst kein depends_on: Caddy soll auch dann starten, wenn nur eine der
    # beiden Umgebungen vorhanden ist. Sonst zieht ein Ausrollen der
    # Testumgebung das Produktiv-Image mit, das es beim ersten Mal noch gar
    # nicht gibt. Die Adressen loest Caddy erst bei der Anfrage auf.

  # Produktivumgebung - wird aus dem Branch master gebaut.
  app-prod:
    image: ${IMAGE_PROD:?IMAGE_PROD fehlt}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy terminiert TLS; die App muss wissen, dass die Anfrage von außen
      # über HTTPS kam.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - prod-data:/data

  # Testumgebung - wird aus dem Branch test gebaut.
  app-test:
    image: ${IMAGE_TEST:?IMAGE_TEST fehlt}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - test-data:/data

  # Entwicklungsumgebung - wird aus dem Branch develop gebaut.
  # Vorgabewerte statt Pflichtangaben, damit ältere .env-Dateien gültig bleiben.
  app-dev:
    image: ${IMAGE_DEV:-ghcr.io/v07gvo9/sitzordnung:develop}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - dev-data:/data

volumes:
  caddy-data:
  caddy-config:
  prod-data:
  test-data:
  dev-data:
