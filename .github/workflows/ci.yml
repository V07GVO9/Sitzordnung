name: Tests

# Läuft bei Pull Requests. Für master, test und develop ruft "Ausrollen"
# (deploy.yml) diesen Workflow selbst auf - so wird pro Push nur einmal getestet.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      docker-bauen:
        description: "Docker-Image zur Probe bauen"
        type: boolean
        default: true

# Neuere Pushes auf denselben Pull Request brechen ältere Läufe ab.
# Bei workflow_call gilt die Gruppe des aufrufenden Workflows.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-und-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: NuGet-Pakete aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Backend testen
        run: dotnet test backend/Sitzordnung.sln --configuration Release

      # Das Docker-Image baut das Frontend selbst (npm ci + npm run build),
      # ein eigener Frontend-Schritt wäre doppelte Arbeit.
      - uses: docker/setup-buildx-action@v3
        if: inputs.docker-bauen != false

      - name: Docker-Image bauen (mit Frontend)
        if: inputs.docker-bauen != false
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sitzordnung:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull Requests in den Branch "test" werden automatisch genehmigt und gemerged,
  # sobald alle Tests grün sind. Nach "master" wird weiterhin von Hand freigegeben.
  # Nur für Branches aus diesem Repository (keine Forks, keine Entwürfe).
  automatisch-mergen-test:
    needs: build-und-test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'test' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Die Genehmigung ist nur ein Vermerk. Erlaubt die Repo-Einstellung
      # Actions das Genehmigen nicht, wird trotzdem gemerged.
      - name: Pull Request genehmigen
        continue-on-error: true
        run: gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "Alle Tests erfolgreich – automatisch genehmigt."

      - name: Pull Request mergen
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge

      # Merges mit dem GITHUB_TOKEN lösen keine push-Workflows aus,
      # daher Ausrollen und Android-App hier ausdrücklich starten.
      - name: Ausrollen und Android-App starten
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref test
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref test
