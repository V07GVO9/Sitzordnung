name: Tests

on:
  push:
    branches: [master, develop, test, "claude/**"]
  pull_request:

jobs:
  build-und-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend testen
        run: dotnet test backend/Sitzordnung.sln --configuration Release

      - name: Frontend bauen
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Docker-Image bauen
        run: docker build -t sitzordnung:ci .
